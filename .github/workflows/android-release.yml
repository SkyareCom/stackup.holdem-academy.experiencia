name: Build Academy AAB

on:
  workflow_dispatch:
  push:
    branches:
      - fix-uniform-root-cards-70
    paths:
      - 'app/build.gradle'
      - '.github/workflows/android-release.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Verify approved front is packaged
        shell: bash
        run: cmp --silent index.html app/src/main/assets/index.html || (echo "Packaged front differs from approved index.html" && exit 1)

      - name: Verify local-only Android shell
        shell: bash
        run: |
          grep -q "applicationId 'com.skyare.stackupacademy'" app/build.gradle
          grep -q "versionCode 238" app/build.gradle
          grep -q 'file:///android_asset/index.html' app/src/main/java/com/skyare/stackupacademy/MainActivity.java
          ! grep -R -E 'loadUrl\("https?://' app/src/main/java app/src/main/assets
          grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
          grep -q 'android.permission.USE_BIOMETRIC' app/src/main/AndroidManifest.xml
          ! grep -R -E 'loadUrl\("https?://' app/src/main/java

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Validate release signing configuration
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ACADEMY_UPLOAD_KEYSTORE_B64 }}
          ACADEMY_KEYSTORE_PASSWORD: ${{ secrets.ACADEMY_KEYSTORE_PASSWORD }}
          ACADEMY_KEY_ALIAS: ${{ secrets.ACADEMY_KEY_ALIAS }}
          ACADEMY_KEY_PASSWORD: ${{ secrets.ACADEMY_KEY_PASSWORD }}
        run: |
          missing=0
          for var in KEYSTORE_B64 ACADEMY_KEYSTORE_PASSWORD ACADEMY_KEY_ALIAS ACADEMY_KEY_PASSWORD; do
            if [ -z "${!var}" ]; then
              echo "::error title=Missing Android signing secret::Configure $var in Settings > Secrets and variables > Actions"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/academy-upload.jks"
          if [ ! -s "$RUNNER_TEMP/academy-upload.jks" ]; then
            echo "::error::Keystore decoded to an empty file"
            exit 1
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/academy-upload.jks" -storepass:env ACADEMY_KEYSTORE_PASSWORD -alias "$ACADEMY_KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error title=Keystore validation failed::Check keystore password, alias and upload key; do not create a new signing key"
            exit 1
          fi

      - name: Build signed release AAB
        env:
          ACADEMY_KEYSTORE_PATH: ${{ runner.temp }}/academy-upload.jks
          ACADEMY_KEYSTORE_PASSWORD: ${{ secrets.ACADEMY_KEYSTORE_PASSWORD }}
          ACADEMY_KEY_ALIAS: ${{ secrets.ACADEMY_KEY_ALIAS }}
          ACADEMY_KEY_PASSWORD: ${{ secrets.ACADEMY_KEY_PASSWORD }}
          STACKUP_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STACKUP_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$STACKUP_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error title=Missing app configuration::Set STACKUP_SUPABASE_PUBLISHABLE_KEY in Actions secrets"
            exit 1
          fi
          gradle --no-daemon bundleRelease
          test -s app/build/outputs/bundle/release/app-release.aab

      - uses: actions/upload-artifact@v4
        with:
          name: stackup-academy-v238-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
