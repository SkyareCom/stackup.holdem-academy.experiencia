name: Android Play AAB
on:
  workflow_dispatch:
  push:
    branches: [ main, academy-verde3-stackup-auth ]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/android-aab.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: android-signing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare Play upload signing
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_UPLOAD_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/stackup-upload.jks"
          chmod 600 "$RUNNER_TEMP/stackup-upload.jks"
      - name: Build signed Play AAB
        env:
          STACKUP_UPLOAD_KEYSTORE: ${{ runner.temp }}/stackup-upload.jks
          STACKUP_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          STACKUP_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          STACKUP_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: gradle :app:bundleRelease
      - name: Verify Play AAB
        run: |
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          unzip -t "$AAB"
          jarsigner -verify -verbose -certs "$AAB"
          sha256sum "$AAB" > "$AAB.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: stackup-academy-play-221-aab
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/bundle/release/app-release.aab.sha256
