name: Android Source Verify

on:
  push:
    branches:
      - main
      - release/academy-play-228-clean
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/android-aab.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/android-aab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.11.1'

      - name: Lint release
        run: gradle :app:lintRelease --stacktrace

      - name: Build debug validation APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify published Academy identity
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -s "$APK"
          "$AAPT" dump badging "$APK" | tee /tmp/academy-badging.txt
          grep -q "package: name='com.skyare.stackupacademy'" /tmp/academy-badging.txt
          grep -q "versionCode='228'" /tmp/academy-badging.txt
          grep -q "versionName='2.1.12'" /tmp/academy-badging.txt
          grep -q "launchable-activity: name='com.skyare.stackupacademy.MainActivity'" /tmp/academy-badging.txt

      - name: Verify approved front is bundled
        run: |
          test -s app/src/main/assets/index.html
          test -s app/src/main/assets/academy-content.js
          test -s app/src/main/assets/assets/bg.js
          test -s app/src/main/assets/assets/logo.js
          cmp -s index.html app/src/main/assets/index.html
          cmp -s academy-content.js app/src/main/assets/academy-content.js
          cmp -s assets/bg.js app/src/main/assets/assets/bg.js
          cmp -s assets/logo.js app/src/main/assets/assets/logo.js
