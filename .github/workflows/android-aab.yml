name: Android Validation Build
on:
  workflow_dispatch:
  push:
    branches: [ fix-uniform-root-cards-70 ]
    paths:
      - '.github/workflows/android-aab.yml'
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Validate approved front and build debug APK
        env:
          STACKUP_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STACKUP_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          cmp --silent index.html app/src/main/assets/index.html
          gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: stackup-academy-v238-diagnostic-apk
          path: app/build/outputs/apk/debug/app-debug.apk
