name: Security Audit

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Security repository guard
        run: node scripts/security-guard.js

      - name: Verify protected files are owned
        run: |
          grep -q '/.github/workflows/ @SkyareCom' .github/CODEOWNERS
          grep -q '/android/ @SkyareCom' .github/CODEOWNERS
          grep -q '/sw.js @SkyareCom' .github/CODEOWNERS
          grep -q '/index.html @SkyareCom' .github/CODEOWNERS
