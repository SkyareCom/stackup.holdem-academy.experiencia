plugins { id 'com.android.application' }

android {
    namespace 'com.skyare.stackupacademy'
    compileSdk 36

    defaultConfig {
        applicationId 'com.skyare.stackupacademy'
        minSdk 24
        targetSdk 36
        versionCode 226
        versionName '1.0.9'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies { }
