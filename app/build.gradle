plugins { id 'com.android.application' }

android {
    namespace 'com.skyare.stackupholdemexperiencia'
    compileSdk 36

    defaultConfig {
        applicationId 'com.skyare.stackupholdemexperiencia'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}


dependencies {
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.fragment:fragment:1.8.9'
}
