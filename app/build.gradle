plugins { id 'com.android.application' }

def academyKeystorePath = System.getenv('ACADEMY_KEYSTORE_PATH')
def academyKeystorePassword = System.getenv('ACADEMY_KEYSTORE_PASSWORD')
def academyKeyAlias = System.getenv('ACADEMY_KEY_ALIAS')
def academyKeyPassword = System.getenv('ACADEMY_KEY_PASSWORD')

def stackupSupabaseKey = System.getenv('STACKUP_SUPABASE_PUBLISHABLE_KEY') ?: ''

android {
    namespace 'com.skyare.stackupacademy'
    buildFeatures { buildConfig true }
    compileSdk 36

    defaultConfig {
        applicationId 'com.skyare.stackupacademy'
        minSdk 24
        targetSdk 36
        versionCode 237
        versionName '2.1.21'
        buildConfigField 'String', 'SUPABASE_PUBLISHABLE_KEY', '\"' + stackupSupabaseKey + '\"'
    }

    signingConfigs {
        release {
            if (academyKeystorePath) {
                storeFile file(academyKeystorePath)
                storePassword academyKeystorePassword
                keyAlias academyKeyAlias
                keyPassword academyKeyPassword
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation('androidx.biometric:biometric:1.1.0') {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    }
    implementation('androidx.fragment:fragment:1.8.9') {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    }
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
}

