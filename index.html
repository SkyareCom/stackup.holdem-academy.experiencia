<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Academy Premium Functional v11</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Saira:wght@400;500;600;700;800&family=Saira+Stencil+One&display=swap');
:root{
  --text:#f7f7f1;
  --muted:rgba(247,247,241,.72);
  --muted2:rgba(247,247,241,.54);
  --line:rgba(97,255,152,.15);
  --line2:rgba(97,255,152,.18);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;background:#000;color:var(--text);font-family:'Saira',system-ui,sans-serif;}
body{display:flex;justify-content:center;}
.app{position:relative;width:min(100vw,430px);height:100svh;overflow:hidden;background:#000;}
.bg{position:absolute;inset:0;background-position:center;background-size:cover;background-repeat:no-repeat;}
.overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.16) 0%,rgba(1,8,4,.12) 18%,rgba(1,8,4,.14) 52%,rgba(0,0,0,.30) 100%);}
.ambient{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 57%, rgba(39,255,117,.10) 0%, rgba(39,255,117,0) 30%),radial-gradient(ellipse at 50% 77%, rgba(39,255,117,.05) 0%, rgba(39,255,117,0) 24%);}
.screen{position:relative;z-index:1;height:100%;padding:10px 16px max(12px, env(safe-area-inset-bottom));display:grid;grid-template-rows:auto auto auto auto 1fr;gap:8px;align-items:start;}
.logo-wrap{display:flex;justify-content:center;padding-top:2px;}
.logo{width:min(43vw,172px);height:auto;display:block;filter:drop-shadow(0 4px 10px rgba(0,0,0,.34));}
.brand{text-align:center;margin-top:4px;}
.stackup{font-family:'Saira',sans-serif;font-size:clamp(18px,3.2svh,26px);font-weight:800;line-height:1.02;letter-spacing:.025em;text-transform:uppercase;color:#f6f6f0;text-shadow:0 2px 8px rgba(0,0,0,.55);}
.academy{margin-top:-2px;font-family:'Saira Stencil One','Saira',sans-serif;font-size:clamp(54px,7.8svh,76px);line-height:.90;letter-spacing:.012em;text-transform:uppercase;color:rgba(42,220,98,.58);-webkit-text-stroke:1.15px rgba(14,18,14,.80);text-shadow:0 0 12px rgba(52,255,126,.18),0 0 24px rgba(52,255,126,.07),0 1px 0 rgba(0,0,0,.45);}
.tagline-wrap{margin:2px auto 0;width:min(100%,338px);border-radius:18px;padding:8px 12px;border:1px solid var(--line2);background:rgba(8,20,13,.34);box-shadow:inset 0 0 0 1px rgba(255,255,255,.02);}
.tagline{text-align:center;font-family:'Saira',sans-serif;font-size:clamp(11px,1.95svh,14px);font-weight:700;line-height:1.1;letter-spacing:.11em;text-transform:uppercase;color:#f2efe8;white-space:nowrap;}
.lang-row{display:flex;justify-content:center;gap:10px;margin-top:2px;}
button{appearance:none;border:none;outline:none;background:none;}
.lang-btn{min-height:46px;padding:0 18px;border-radius:18px;background:rgba(8,20,13,.56);border:1px solid rgba(106,255,161,.16);box-shadow:inset 0 0 0 1px rgba(255,255,255,.02);color:#ecebe5;font-family:'Saira',sans-serif;font-size:12px;font-weight:500;letter-spacing:.01em;white-space:nowrap;}
.cards{display:flex;flex-direction:column;gap:9px;margin-top:6px;align-self:start;}
.card{min-height:58px;display:grid;grid-template-columns:32px 1fr 14px;align-items:center;gap:10px;padding:10px 12px;border-radius:20px;background:linear-gradient(180deg, rgba(9,22,15,.64), rgba(7,17,12,.70));border:1px solid var(--line);box-shadow:inset 0 0 0 1px rgba(255,255,255,.02);text-align:left;}
.icon-wrap{width:30px;height:30px;display:grid;place-items:center;color:rgba(245,245,239,.92);}
.g-icon{width:28px;height:28px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.18);}
.g-icon span{font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:700;line-height:1;background:conic-gradient(#4285F4 0 25%, #34A853 25% 50%, #FBBC05 50% 75%, #EA4335 75% 100%);-webkit-background-clip:text;background-clip:text;color:transparent;}
.icon-line{width:26px;height:26px;}
.copy{min-width:0;text-align:left;}
.title{font-family:'Saira',sans-serif;font-size:12px;font-weight:700;line-height:1.05;letter-spacing:.005em;color:#f5f5ef;text-transform:uppercase;}
.subtitle{margin-top:3px;font-family:'Saira',sans-serif;font-size:12px;font-weight:500;line-height:1.06;color:var(--muted);}
.status{font-weight:700;color:rgba(245,245,239,.78);text-transform:uppercase;white-space:nowrap;}
.chev{font-family:'Saira',sans-serif;font-size:24px;line-height:1;color:rgba(245,245,239,.82);justify-self:end;}
.disabled .chev{visibility:hidden;}
.disabled .subtitle{color:var(--muted2);}
#toast{position:absolute;left:50%;bottom:22px;transform:translateX(-50%) translateY(18px);background:rgba(5,12,8,.94);color:#f7f7f1;border:1px solid rgba(106,255,161,.20);border-radius:14px;padding:10px 14px;font:600 12px 'Saira',sans-serif;letter-spacing:.01em;opacity:0;pointer-events:none;transition:opacity .18s ease, transform .18s ease;z-index:20;max-width:84%;text-align:center;box-shadow:0 8px 28px rgba(0,0,0,.28);}
#biometric-screen{position:absolute;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(1,8,4,.94);backdrop-filter:blur(4px);}
.bio-card{width:100%;max-width:340px;border:1px solid rgba(106,255,161,.18);border-radius:22px;background:rgba(8,20,13,.90);padding:26px 20px;text-align:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.02);}
.bio-title{font:700 18px 'Saira',sans-serif;color:#f5f5ef;}
.bio-copy{margin-top:8px;font:500 13px/1.35 'Saira',sans-serif;color:rgba(247,247,241,.72);}
.bio-btn{width:100%;min-height:46px;margin-top:18px;border-radius:14px;border:1px solid rgba(106,255,161,.22);background:rgba(16,37,24,.82);color:#f5f5ef;font:700 12px 'Saira',sans-serif;}
.bio-back{width:100%;min-height:42px;margin-top:8px;border-radius:14px;border:1px solid rgba(255,255,255,.08);background:transparent;color:rgba(247,247,241,.72);font:600 12px 'Saira',sans-serif;}
@media (max-width:360px){
  .screen{padding-left:12px;padding-right:12px;}
  .logo{width:min(45vw,164px);}
  .academy{font-size:48px;}
  .lang-row{gap:8px;}
  .lang-btn{padding:0 14px;font-size:11px;}
  .title,.subtitle{font-size:11px;}
}
</style>

<style id="experience-internal-shell">
.internal-shell{position:absolute;inset:0;z-index:40;display:none;overflow:hidden;color:var(--text)}
.internal-shell.active{display:block}
.internal-bg{position:absolute;inset:0;background-position:center;background-size:cover;background-repeat:no-repeat}
.internal-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.16),rgba(1,8,4,.12) 18%,rgba(1,8,4,.14) 52%,rgba(0,0,0,.30))}
.internal-ambient{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 57%,rgba(39,255,117,.10),transparent 30%),radial-gradient(ellipse at 50% 77%,rgba(39,255,117,.05),transparent 24%);pointer-events:none}
.internal-page{position:absolute;inset:0 0 66px;z-index:2;display:none;padding:14px 16px 18px;overflow:hidden}
.internal-page.active{display:block}
.internal-head{display:flex;align-items:center;gap:10px}
.internal-logo{width:50px;height:50px;object-fit:contain;filter:drop-shadow(0 3px 8px rgba(0,0,0,.34))}
.internal-title{display:inline-flex;align-items:center;min-height:34px;padding:7px 14px;border:1px solid var(--line2);border-radius:18px;background:rgba(8,20,13,.34);font:700 12px/1 'Saira',sans-serif;letter-spacing:.11em;text-transform:uppercase;color:#f2efe8}
.internal-content{height:calc(100% - 64px)}
.internal-nav{position:absolute;left:0;right:0;bottom:0;z-index:3;height:66px;padding:0 8px max(4px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);align-items:center;background:rgba(2,8,5,.86);border-top:1px solid rgba(97,255,152,.15);backdrop-filter:blur(10px)}
.internal-nav button{height:52px;padding:4px 2px 2px;color:rgba(247,247,241,.48);font:600 10px/1 'Saira',sans-serif;text-transform:uppercase;letter-spacing:.02em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.internal-nav button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.internal-nav button.active{color:#2adc62}
.internal-nav button.active::after{display:none!important}
</style>
<style id="approved-internal-type">
@import url('https://fonts.googleapis.com/css2?family=Saira+Semi+Condensed:wght@400&display=swap');
.internal-shell,.internal-shell *{font-family:'Saira Semi Condensed',sans-serif!important;font-size:12px;font-weight:400}
.internal-nav button,.internal-nav button *{font-family:'Saira Semi Condensed',sans-serif!important;font-size:10px!important;font-weight:400!important}
</style>
<style id="academy-reference-shell">
.internal-content{height:calc(100% - 64px);padding-top:12px;overflow-y:auto;scrollbar-width:none}.internal-content::-webkit-scrollbar{display:none}
.ref-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-bottom:18px}.ref-card{height:154px;padding:12px;border:1px solid rgba(97,255,152,.15);border-radius:18px;background:linear-gradient(180deg,rgba(9,22,15,.62),rgba(7,17,12,.70));display:grid;grid-template-rows:42px 34px 48px;gap:5px;align-items:center;color:#f7f7f1;text-align:center}.ref-icon{height:42px;display:flex;align-items:center;justify-content:center;color:#2adc62}.ref-icon svg{width:27px;height:27px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.ref-card b{height:34px;display:flex;align-items:center;justify-content:center;font:400 12px/1.15 'Saira Semi Condensed',sans-serif;text-transform:uppercase;color:#f7f7f1}.ref-card small{height:48px;display:flex;align-items:flex-start;justify-content:center;overflow:hidden;font:400 12px/1.25 'Saira Semi Condensed',sans-serif;color:rgba(247,247,241,.65)}.ref-back{margin:0 0 10px;padding:8px 12px;border:1px solid rgba(97,255,152,.15);border-radius:14px;background:rgba(7,17,12,.55);color:#f7f7f1;font:400 12px 'Saira Semi Condensed',sans-serif}
</style>
<style id="linear-reference-cards">
.ref-grid{display:grid!important;grid-template-columns:1fr!important;gap:8px!important;width:100%!important}
.ref-card{width:100%!important;height:82px!important;min-height:82px!important;padding:10px 14px!important;display:grid!important;grid-template-columns:42px minmax(0,1fr)!important;grid-template-rows:28px 32px!important;column-gap:12px!important;row-gap:2px!important;align-items:center!important;text-align:left!important}
.ref-icon{grid-column:1!important;grid-row:1 / 3!important;width:42px!important;height:62px!important;display:flex!important;align-items:center!important;justify-content:center!important}
.ref-icon svg{width:26px!important;height:26px!important}
.ref-card b{grid-column:2!important;grid-row:1!important;width:100%!important;height:28px!important;display:flex!important;align-items:end!important;justify-content:flex-start!important;text-align:left!important}
.ref-card small{grid-column:2!important;grid-row:2!important;width:100%!important;height:32px!important;display:flex!important;align-items:start!important;justify-content:flex-start!important;text-align:left!important}
</style>
<style id="top-page-navigation">
.page-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;margin:0 0 10px}.page-action,.profile-exit{min-height:38px;border:1px solid rgba(97,255,152,.15);border-radius:14px;background:rgba(7,17,12,.62);color:#f7f7f1;font:400 12px/1 'Saira Semi Condensed',sans-serif;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:7px}.page-action svg,.profile-exit svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.profile-exit{width:100%;margin:0 0 18px}
</style>
<style id="academy-live-content">
.content-view{padding-bottom:18px}.lesson-lead{margin:0 0 10px;padding:11px 13px;border-left:2px solid #2adc62;background:rgba(7,17,12,.58);border-radius:0 12px 12px 0;color:rgba(247,247,241,.72);font:400 12px/1.4 'Saira Semi Condensed',sans-serif}.lesson{display:grid;gap:8px}.lesson>*,.lesson .lc,.lesson .rrow,.lesson .qcard{box-sizing:border-box;max-width:100%;margin:0;padding:11px 13px;border:1px solid rgba(97,255,152,.13);border-radius:14px;background:rgba(7,17,12,.58);color:rgba(247,247,241,.74);font:400 12px/1.42 'Saira Semi Condensed',sans-serif}.lesson h1,.lesson h2,.lesson h3,.lesson h4,.lesson b,.lesson strong{color:#f7f7f1;font:400 12px/1.25 'Saira Semi Condensed',sans-serif;text-transform:uppercase}.lesson p,.lesson li,.lesson span{font:400 12px/1.42 'Saira Semi Condensed',sans-serif}.lesson table{width:100%;border-collapse:collapse;font-size:12px}.lesson td,.lesson th{padding:6px;border-bottom:1px solid rgba(97,255,152,.12);text-align:left}.lesson img{max-width:100%}.lesson .pc{display:inline-flex!important;width:auto!important;min-width:30px!important;justify-content:center!important;margin:2px!important;padding:5px!important;background:#f2efe8!important;color:#111!important;border-radius:5px!important}.content-next{width:100%;min-height:42px;margin:10px 0;border:1px solid rgba(97,255,152,.22);border-radius:14px;background:rgba(18,70,38,.54);color:#f7f7f1;font:400 12px 'Saira Semi Condensed',sans-serif;text-transform:uppercase}.quiz-box,.sim-box,.profile-box,.metric-box{padding:12px;border:1px solid rgba(97,255,152,.14);border-radius:14px;background:rgba(7,17,12,.62);margin-bottom:9px}.quiz-progress{display:flex;justify-content:space-between;margin-bottom:9px;color:rgba(247,247,241,.58)}.quiz-prompt{color:#f7f7f1;margin-bottom:10px;line-height:1.4}.quiz-option{width:100%;min-height:40px;margin:5px 0;padding:8px 10px;border:1px solid rgba(97,255,152,.14);border-radius:12px;background:rgba(4,12,8,.64);color:#f7f7f1;text-align:left;font:400 12px 'Saira Semi Condensed',sans-serif}.quiz-option.ok{border-color:#2adc62;color:#2adc62}.quiz-option.bad{border-color:rgba(255,110,110,.7);color:#ff9b9b}.quiz-analysis{margin-top:8px;color:rgba(247,247,241,.68);line-height:1.4}.sim-cards{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}.sim-card{padding:6px 8px;border-radius:6px;background:#f2efe8;color:#111}.metric-row{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:9px}.metric-box{text-align:center;margin:0}.metric-box b{display:block;font-size:18px;font-weight:400;color:#2adc62}.profile-box b{display:block;margin-bottom:5px;color:#f7f7f1}.empty-note{padding:18px;text-align:center;color:rgba(247,247,241,.55)}.section-label{margin:2px 0 8px;color:#2adc62;text-transform:uppercase}.ref-card{cursor:pointer}
</style>
</head>
<body>
<main class="app">
  <div class="bg"></div>
  <div class="overlay"></div>
  <div class="ambient"></div>
  <div class="screen">
    <div class="logo-wrap"><img class="logo" src="" alt="StackUp Hold'em logo"></div>
    <section class="brand" aria-label="branding">
      <div class="stackup">STACKUP HOLD'EM</div>
      <div class="academy">ACADEMY</div>

    <div class="tagline-wrap"><div class="tagline">POKER DO ZERO AO REAL GAME.</div></div>
    <div class="lang-row" aria-label="languages">
      <button class="lang-btn" type="button" data-lang="pt">PT-BR</button>
      <button class="lang-btn" type="button" data-lang="en">EN-US</button>
      <button class="lang-btn" type="button" data-lang="es">ES-ES</button>

    <section class="cards" aria-label="login methods">
      <button class="card" type="button" data-action="google">

        <div class="copy"><div class="title">ENTRAR COM GOOGLE</div><div class="subtitle">Acesso temporário liberado</div></div>

      </button>
      <button class="card" type="button" data-action="biometria">
        <div class="icon-wrap"><svg class="icon-line" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 11a4 4 0 1 0-4-4 4 4 0 0 0 4 4Z"/><path d="M4.5 20.5a7.5 7.5 0 0 1 15 0"/></svg></div>
        <div class="copy"><div class="title">ENTRAR COM BIOMETRIA</div><div class="subtitle">Use a biometria deste aparelho</div></div>
        <div class="chev">›</div>
      </button>
      <button class="card disabled" type="button" data-action="stackup">

        <div class="chev"></div>
      </button>

  </div>
  
<section id="internal-shell" class="internal-shell" aria-label="Academy">
  <div class="internal-bg"></div><div class="internal-overlay"></div><div class="internal-ambient"></div>
  <section class="internal-page active" data-page="home"><header class="internal-head"><img class="internal-logo" alt="StackUp Hold'em"><div class="internal-title">HOME</div></header><div class="internal-content"></div></section>

</section>
  <div id="toast" aria-live="polite"></div>

      <button id="bio-enter" class="bio-btn" type="button">ENTRAR</button>

  </section>
</main>

<script>
(() => {
  const translations = {
    pt: {tagline:'POKER DO ZERO AO REAL GAME.',googleTitle:'ENTRAR COM GOOGLE',googleSub:'Continue com sua conta Google · INATIVO',bioTitle:'ENTRAR COM BIOMETRIA',bioSub:'Use a biometria deste aparelho',stackTitle:'ENTRAR COM STACKUP ID',stackSub:'Use seu e-mail e senha StackUp · INATIVO',unavailable:'Recurso inativo nesta versão.',bioScreenTitle:'BIOMETRIA',bioScreenCopy:'Simulação funcional do fluxo de biometria.',enter:'ENTRAR',back:'VOLTAR',success:'Biometria validada. Entrada liberada.'},
    en: {tagline:'POKER FROM ZERO TO REAL GAME.',googleTitle:'CONTINUE WITH GOOGLE',googleSub:'Continue with your Google account · INACTIVE',bioTitle:'CONTINUE WITH BIOMETRICS',bioSub:'Use this device biometrics',stackTitle:'CONTINUE WITH STACKUP ID',stackSub:'Use your StackUp email and password · INACTIVE',unavailable:'Feature inactive in this version.',bioScreenTitle:'BIOMETRICS',bioScreenCopy:'Functional simulation of the biometric flow.',enter:'ENTER',back:'BACK',success:'Biometrics validated. Access granted.'},
    es: {tagline:'POKER DESDE CERO HASTA EL JUEGO REAL.',googleTitle:'ENTRAR CON GOOGLE',googleSub:'Continúa con tu cuenta Google · INACTIVO',bioTitle:'ENTRAR CON BIOMETRÍA',bioSub:'Usa la biometría de este dispositivo',stackTitle:'ENTRAR CON STACKUP ID',stackSub:'Usa tu e-mail y contraseña StackUp · INACTIVO',unavailable:'Recurso inactivo en esta versión.',bioScreenTitle:'BIOMETRÍA',bioScreenCopy:'Simulación funcional del flujo biométrico.',enter:'ENTRAR',back:'VOLVER',success:'Biometría validada. Acceso liberado.'}
  };
  let lang='pt';
  const toast=document.getElementById('toast');
  const bioScreen=document.getElementById('biometric-screen');
  function showToast(text){toast.textContent=text;toast.style.opacity='1';toast.style.transform='translateX(-50%) translateY(0)';clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(()=>{toast.style.opacity='0';toast.style.transform='translateX(-50%) translateY(18px)';},1600);}
  function applyLanguage(next){lang=next;const t=translations[lang];document.querySelector('.tagline').textContent=t.tagline;const google=document.querySelector('[data-action="google"]');google.querySelector('.title').textContent=t.googleTitle;google.querySelector('.subtitle').innerHTML=t.googleSub.replace(/(INATIVO|INACTIVE|INACTIVO)$/,'<span class="status">$1</span>');const bio=document.querySelector('[data-action="biometria"]');bio.querySelector('.title').textContent=t.bioTitle;bio.querySelector('.subtitle').textContent=t.bioSub;const stack=document.querySelector('[data-action="stackup"]');stack.querySelector('.title').textContent=t.stackTitle;stack.querySelector('.subtitle').innerHTML=t.stackSub.replace(/(INATIVO|INACTIVE|INACTIVO)$/,'<span class="status">$1</span>');document.getElementById('bio-title').textContent=t.bioScreenTitle;document.getElementById('bio-copy').textContent=t.bioScreenCopy;document.getElementById('bio-enter').textContent=t.enter;document.getElementById('bio-back').textContent=t.back;}
  document.querySelectorAll('[data-lang]').forEach(btn=>btn.addEventListener('click',()=>applyLanguage(btn.dataset.lang)));
  document.querySelector('[data-action="google"]').addEventListener('click',()=>{const shell=document.getElementById('internal-shell');shell.classList.add('active');document.querySelectorAll('.internal-bg').forEach(el=>el.style.backgroundImage='url('+window.ACADEMY_BG+')');document.querySelectorAll('.internal-logo').forEach(el=>el.src=window.ACADEMY_LOGO);});
  document.querySelector('[data-action="stackup"]').addEventListener('click',()=>showToast(translations[lang].unavailable));
  document.querySelector('[data-action="biometria"]').addEventListener('click',()=>{bioScreen.style.display='flex';});
  document.getElementById('bio-back').addEventListener('click',()=>{bioScreen.style.display='none';});
  document.getElementById('bio-enter').addEventListener('click',()=>{bioScreen.style.display='none';showToast(translations[lang].success);});
})();

<script id="experience-internal-navigation">
(()=>{const shell=document.getElementById('internal-shell');const open=()=>{shell.classList.add('active');document.querySelectorAll('.internal-bg').forEach(el=>el.style.backgroundImage='url('+window.ACADEMY_BG+')');document.querySelectorAll('.internal-logo').forEach(el=>el.src=window.ACADEMY_LOGO)};document.querySelectorAll('[data-page-target]').forEach(btn=>btn.addEventListener('click',()=>{const p=btn.dataset.pageTarget;document.querySelectorAll('.internal-page').forEach(el=>el.classList.toggle('active',el.dataset.page===p));document.querySelectorAll('[data-page-target]').forEach(el=>el.classList.toggle('active',el===btn))}));document.getElementById('bio-enter').addEventListener('click',()=>setTimeout(open,0));window.openAcademyHome=open})();

<script src="academy-content.js"></script>
<script id="academy-reference-structure">
(()=>{const D=window.ACADEMY_DATA||{}, I='<svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H11v16H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M20 5.5A2.5 2.5 0 0 0 17.5 3H13v16h4.5a2.5 2.5 0 0 1 2.5 2.5z"/></svg>',T='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><path d="m9 12 2 2 4-4"/></svg>',P='<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4.5 21a7.5 7.5 0 0 1 15 0"/></svg>',C='<svg viewBox="0 0 24 24"><rect x="5" y="3" width="12" height="16" rx="2"/><path d="M19 7v12a2 2 0 0 1-2 2H9"/></svg>';
const state={lang:'pt',trail:{base:[],modalidades:[],pratica:[]},quiz:null,sim:0};
const el=k=>document.querySelector('.internal-page[data-page="'+k+'"] .internal-content'), tx=o=>o&&typeof o==='object'?(o[state.lang]||o.pt||o.en||Object.values(o)[0]):String(o||''), esc=x=>String(x??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const roots={base:D.FUND||[],modalidades:D.MOD||[],pratica:D.PRAT||[]};
const home=[['base','BASE','Fundamentos essenciais do jogo.',I],['modalidades','MODALIDADES','Variantes e formatos de poker.',C],['pratica','PRÁTICA','Simulador, quiz e matemática.',T],['evolucao','MINHA EVOLUÇÃO','Desempenho e progresso pessoal.',T],['historico','HISTÓRICO','Registro dos treinos realizados.',I],['perfil','PERFIL','Conta, preferências e planos.',P]];
const icon=n=>n&&String(n.ic||'').startsWith('m_')?C:n&&String(n.ic||'').startsWith('p_')?T:I;
const card=(id,title,desc,ic=I)=>'<button class="ref-card" data-ref="'+esc(id)+'"><span class="ref-icon">'+ic+'</span><b>'+esc(title)+'</b><small>'+esc(desc)+'</small></button>';
function navMarkup(k){return k==='home'?'<div class="page-actions"><button class="page-action" data-exit>SAIR DO APP</button><button class="page-action" data-next>PRÓXIMA TELA</button></div>':'<div class="page-actions"><button class="page-action" data-inner-back>‹ VOLTAR</button><button class="page-action" data-home>⌂ HOME</button></div>'}
function setTitle(k,t){const x=document.querySelector('.internal-page[data-page="'+k+'"] .internal-title');if(x)x.textContent=t||k.toUpperCase()}
function list(k,nodes,title){const c=el(k);if(!c)return;c.innerHTML=navMarkup(k)+'<div class="ref-grid">'+nodes.map(n=>card(n.id,tx(n.t),tx(n.d),icon(n))).join('')+'</div>';setTitle(k,title||k.toUpperCase())}
function renderRoot(k){state.trail[k]=[];list(k,roots[k]||[],k.toUpperCase())}
function findNode(k,id,nodes=roots[k]||[]){for(const n of nodes){if(n.id===id)return n;if(n.sub){const q=findNode(k,id,n.sub);if(q)return q}}return null}
function showNode(k,n){state.trail[k].push(n.id);setTitle(k,tx(n.t));if(n.sub&&n.sub.length){list(k,n.sub,tx(n.t));return}
 const c=el(k),lead=n.lead?'<p class="lesson-lead">'+esc(tx(n.lead))+'</p>':'',body=n.html?'<div class="lesson">'+n.html+'</div>':'';
 if(n.sim){showSimulator(k);return}
 if(!n.html&&n.quiz){startQuiz(k,n);return}
 c.innerHTML=navMarkup(k)+'<div class="content-view">'+lead+body+(n.quiz?'<button class="content-next" data-train="'+esc(n.id)+'">TREINAR ESTE TEMA ›</button>':'')+'</div>'}
function progress(){try{return JSON.parse(localStorage.getItem('academy.experience.progress')||'{"answers":0,"ok":0,"runs":[]}')}catch(e){return {answers:0,ok:0,runs:[]}}}
function saveProgress(p){localStorage.setItem('academy.experience.progress',JSON.stringify(p))}
function startQuiz(k,n){const qs=n.quiz||[];state.quiz={k,n,qs,i:0,ok:0,answered:false};renderQuiz()}
function renderQuiz(){const qz=state.quiz;if(!qz)return;const q=qz.qs[qz.i],c=el(qz.k);if(!q){const p=progress();p.runs.push({type:'quiz',title:tx(qz.n.t),ok:qz.ok,total:qz.qs.length,at:Date.now()});saveProgress(p);c.innerHTML=navMarkup(qz.k)+'<div class="quiz-box"><div class="section-label">TREINO CONCLUÍDO</div><div class="metric-row"><div class="metric-box"><b>'+qz.ok+'</b>ACERTOS</div><div class="metric-box"><b>'+qz.qs.length+'</b>QUESTÕES</div><div class="metric-box"><b>'+Math.round(qz.ok/Math.max(1,qz.qs.length)*100)+'%</b>PRECISÃO</div></div></div><button class="content-next" data-restart-quiz>RECOMEÇAR TREINO</button>';return}
 const opts=(q.options||q.items||[]).map(o=>'<button class="quiz-option" data-answer="'+esc(o)+'">'+esc(o)+'</button>').join('');
 c.innerHTML=navMarkup(qz.k)+'<div class="quiz-box"><div class="quiz-progress"><span>'+esc(tx(qz.n.t))+'</span><span>'+(qz.i+1)+' / '+qz.qs.length+'</span></div><div class="quiz-prompt">'+esc(q.prompt)+'</div>'+opts+'<div class="quiz-analysis" id="quiz-analysis"></div></div>'}
function answer(btn,val){const z=state.quiz;if(!z||z.answered)return;const q=z.qs[z.i],ok=Array.isArray(q.answer)?false:val===q.answer;z.answered=true;if(ok)z.ok++;const p=progress();p.answers++;if(ok)p.ok++;saveProgress(p);btn.parentElement.querySelectorAll('.quiz-option').forEach(b=>{if(b.dataset.answer===String(q.answer))b.classList.add('ok');else if(b===btn&&!ok)b.classList.add('bad');b.disabled=true});const a=document.getElementById('quiz-analysis');if(a)a.innerHTML='<b>'+(ok?'CORRETO':'AJUSTAR')+'</b><br>'+esc(q.analysis||'');setTimeout(()=>{z.i++;z.answered=false;renderQuiz()},850)}
function showSimulator(k){const bank=D.SIMB||[];const q=bank[state.sim%bank.length],c=el(k);if(!q){c.innerHTML=navMarkup(k)+'<div class="empty-note">Banco do simulador indisponível.</div>';return}setTitle(k,'SIMULADOR');const cards=(q.heroCards||'').split(/\s+/).filter(Boolean).map(x=>'<span class="sim-card">'+esc(x)+'</span>').join('');const board=(q.board||'').split(/\s+/).filter(Boolean).map(x=>'<span class="sim-card">'+esc(x)+'</span>').join('');c.innerHTML=navMarkup(k)+'<div class="sim-box"><div class="section-label">'+esc(q.game)+' · '+esc(q.street||q.phase||'')+'</div><div>'+esc(q.context||'')+'</div><div class="sim-cards">'+cards+'</div><div class="sim-cards">'+board+'</div><div class="quiz-prompt">'+esc(q.question)+'</div>'+(q.options||[]).map(o=>'<button class="quiz-option" data-sim-answer="'+esc(o)+'">'+esc(o)+'</button>').join('')+'<div class="quiz-analysis" id="sim-analysis"></div></div>'}
function simAnswer(btn,val){const q=(D.SIMB||[])[state.sim%(D.SIMB||[]).length],ok=val===q.answer,p=progress();p.answers++;if(ok)p.ok++;p.runs.push({type:'sim',title:q.game,ok:ok?1:0,total:1,at:Date.now()});saveProgress(p);btn.parentElement.querySelectorAll('.quiz-option').forEach(b=>{if(b.dataset.simAnswer===String(q.answer))b.classList.add('ok');else if(b===btn&&!ok)b.classList.add('bad');b.disabled=true});document.getElementById('sim-analysis').innerHTML='<b>'+(ok?'CORRETO':'AJUSTAR')+'</b><br>'+esc(q.why||'');setTimeout(()=>{state.sim++;showSimulator('pratica')},1000)}
function renderHome(){const c=el('home');c.innerHTML=navMarkup('home')+'<div class="ref-grid">'+home.map(x=>card(...x)).join('')+'</div>';setTitle('home','HOME')}
function renderProfile(){const c=el('perfil');c.innerHTML=navMarkup('perfil')+'<div class="profile-box"><b>MEUS DADOS</b><span>Acesso atual ao STACKUP HOLD’EM ACADEMY.</span></div><div class="profile-box"><b>IDIOMA</b><div class="lang-row"><button class="lang-btn" data-content-lang="pt">PT-BR</button><button class="lang-btn" data-content-lang="en">EN-US</button><button class="lang-btn" data-content-lang="es">ES-ES</button></div></div><div class="profile-box"><b>PREFERÊNCIAS</b><span>Configurações de treino e experiência.</span></div><div class="profile-box"><b>MEU PLANO</b><span>Plano e benefícios do Academy.</span></div><div class="profile-box"><b>OUTROS APPS</b><span>GRINDER · HEROES · REVOLUTION · WRAPS · D ACTION</span></div><button class="profile-exit" data-exit>SAIR DO APP</button>';setTitle('perfil','PERFIL')}
function renderStats(){const p=progress(),pct=Math.round(p.ok/Math.max(1,p.answers)*100),c=el('home');c.innerHTML=navMarkup('home')+'<div class="metric-row"><div class="metric-box"><b>'+p.answers+'</b>RESPOSTAS</div><div class="metric-box"><b>'+p.ok+'</b>ACERTOS</div><div class="metric-box"><b>'+pct+'%</b>PRECISÃO</div></div><div class="profile-box"><b>MINHA EVOLUÇÃO</b><span>Os indicadores são atualizados conforme os treinos realizados neste front.</span></div>';setTitle('home','MINHA EVOLUÇÃO')}
function renderHistory(){const p=progress(),c=el('home');c.innerHTML=navMarkup('home')+'<div class="section-label">HISTÓRICO DE TREINOS</div>'+(p.runs.length?p.runs.slice().reverse().map(r=>'<div class="profile-box"><b>'+esc(r.title)+'</b><span>'+r.ok+'/'+r.total+' · '+new Date(r.at).toLocaleString('pt-BR')+'</span></div>').join(''):'<div class="empty-note">Nenhum treino realizado ainda.</div>');setTitle('home','HISTÓRICO')}
function goPage(k){document.querySelector('[data-page-target="'+k+'"]')?.click();if(k==='perfil')renderProfile();else if(roots[k])renderRoot(k)}
renderHome();['base','modalidades','pratica'].forEach(renderRoot);renderProfile();
document.addEventListener('click',e=>{const b=e.target.closest('[data-ref]');if(b){const p=b.closest('.internal-page')?.dataset.page,id=b.dataset.ref;if(p==='home'){if(['base','modalidades','pratica','perfil'].includes(id))goPage(id);else if(id==='evolucao')renderStats();else if(id==='historico')renderHistory();return}const n=findNode(p,id);if(n)showNode(p,n);return}
 const tr=e.target.closest('[data-train]');if(tr){const p=tr.closest('.internal-page').dataset.page,n=findNode(p,tr.dataset.train);if(n)startQuiz(p,n);return}
 const a=e.target.closest('[data-answer]');if(a)return answer(a,a.dataset.answer);const sa=e.target.closest('[data-sim-answer]');if(sa)return simAnswer(sa,sa.dataset.simAnswer);
 if(e.target.closest('[data-restart-quiz]')){state.quiz.i=0;state.quiz.ok=0;state.quiz.answered=false;renderQuiz();return}
 if(e.target.closest('[data-inner-back]')){const p=e.target.closest('.internal-page')?.dataset.page;if(p==='home'){renderHome();return}const t=state.trail[p]||[];t.pop();if(!t.length)renderRoot(p);else{const n=findNode(p,t[t.length-1]);if(n){t.pop();showNode(p,n)}}return}
 if(e.target.closest('[data-home]')){renderHome();goPage('home');return}
 const l=e.target.closest('[data-content-lang]');if(l){state.lang=l.dataset.contentLang;renderHome();['base','modalidades','pratica'].forEach(renderRoot);renderProfile();return}});
document.querySelectorAll('[data-page-target]').forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.pageTarget;if(k==='home')renderHome();else if(k==='perfil')renderProfile();else if(roots[k])renderRoot(k)}));
})();
</script>
<script id="page-navigation-controls">
(()=>{const back='<svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>',home='<svg viewBox="0 0 24 24"><path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10"/></svg>',exit='<svg viewBox="0 0 24 24"><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/><path d="M14 4h6v16h-6"/></svg>',next='<svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>';
function root(){document.querySelectorAll('.internal-page').forEach(x=>x.classList.remove('active'));document.querySelector('.internal-page[data-page="home"]')?.classList.add('active');document.querySelectorAll('.internal-nav button').forEach(x=>x.classList.toggle('active',x.dataset.pageTarget==='home'))}
function exitApp(){document.getElementById('internal-shell')?.classList.remove('active')}
function add(){document.querySelectorAll('.internal-page').forEach(p=>{const c=p.querySelector('.internal-content');if(!c||c.querySelector('.page-actions'))return;const k=p.dataset.page;const nav=document.createElement('div');nav.className='page-actions';if(k==='home')nav.innerHTML='<button class="page-action" data-exit>'+exit+'<span>SAIR DO APP</span></button><button class="page-action" data-next>'+next+'<span>PRÓXIMA TELA</span></button>';else nav.innerHTML='<button class="page-action" data-back>'+back+'<span>VOLTAR</span></button><button class="page-action" data-home>'+home+'<span>HOME</span></button>';c.prepend(nav);if(k==='perfil'){const b=document.createElement('button');b.className='profile-exit';b.dataset.exit='';b.innerHTML=exit+'<span>SAIR DO APP</span>';c.append(b)}})}
document.addEventListener('click',e=>{if(e.target.closest('[data-exit]'))exitApp();if(e.target.closest('[data-home]'))root();if(e.target.closest('[data-next]'))document.querySelector('[data-page-target="base"]')?.click();if(e.target.closest('[data-back]'))history.back()});
const o=new MutationObserver(add);o.observe(document.getElementById('internal-shell'),{subtree:true,childList:true});add();
})();
</script>
